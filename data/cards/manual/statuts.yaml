source:
  name: Constitution et lois statutaires de l'outre-mer
  publisher: Légifrance
  url: https://www.legifrance.gouv.fr
  license: Licence Ouverte 2.0
  note: >
    Statuts administratifs des territoires français, tels que définis par la
    Constitution et les lois statutaires correspondantes.

statuts:
  metropole:
    nom: Département
    base_legale: Article 72 de la Constitution
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000571356

  drom:
    nom: Département et région d'outre-mer
    base_legale: Article 73 de la Constitution
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000571356

  com:
    nom: Collectivité d'outre-mer
    base_legale: Article 74 de la Constitution
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000571356

  collectivite-a-statut-particulier:
    nom: Collectivité territoriale à statut particulier
    base_legale: >
      Titre XIII de la Constitution, loi constitutionnelle n° 98-610 du
      20 juillet 1998 et loi organique n° 99-209 du 19 mars 1999
    url: https://www.insee.fr/fr/information/7929495

  condominium:
    nom: Condominium franco-espagnol
    base_legale: Article 9 du traité de Bayonne du 2 décembre 1856
    url: https://www.insee.fr/fr/information/7929495

  territoire:
    nom: Territoire
    base_legale: >
      Article 72-3 de la Constitution et loi n° 55-1052 du 6 août 1955 portant
      statut des Terres australes et antarctiques françaises et de l'île de
      La Passion-Clipperton
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000879815
    note: >
      L'île de La Passion-Clipperton n'est ni un département ou une région
      d'outre-mer, ni une collectivité d'outre-mer, ni une collectivité à
      statut particulier, et n'est pas dotée de la personnalité morale. Le
      ministère des Outre-mer la présente comme le 13e territoire ultramarin
      français, placé sous l'autorité directe du Gouvernement.

attribution:
  _defaut: metropole
  '971': drom      # Guadeloupe
  '972': drom      # Martinique
  '973': drom      # Guyane
  '974': drom      # La Réunion
  '976': drom      # Mayotte
  '975': com       # Saint-Pierre-et-Miquelon
  '977': com       # Saint-Barthélemy
  '978': com       # Saint-Martin
  '986': com       # Wallis-et-Futuna
  '987': com       # Polynésie française
  '988': collectivite-a-statut-particulier  # Nouvelle-Calédonie
  '981': condominium                        # Ile des Faisans
  '984': territoire                         # Terres australes et antarctiques
  '989': territoire                         # Île de La Passion-Clipperton

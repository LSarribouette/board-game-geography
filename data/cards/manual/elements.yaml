sources:
  cours_eau:
    name: Référentiel hydrographique
    publisher: SANDRE
    url: https://www.sandre.eaufrance.fr
    license: Licence Ouverte 2.0
    note: >
      Sélection éditoriale : les 5 grands fleuves de France métropolitaine,
      2 affluents majeurs pour chacun, et les 2 fleuves frontaliers de Guyane.
    convention: >
      Un département est retenu dès que le cours d'eau le traverse ou le longe,
      y compris lorsqu'il sert de limite départementale ou de frontière.

  massifs:
    name: Les périmètres de massifs
    publisher: Ministère de la Cohésion des territoires
    url: https://www.data.gouv.fr/datasets/les-perimetres-de-massifs
    license: Licence Ouverte 2.0
    note: >
      6 massifs délimités par le décret n° 2004-69 du 16 janvier 2004 en
      application de la loi Montagne. Les Ardennes et le Massif armoricain
      sont ajoutés hors zonage légal (champ `legal: false`).
    convention: >
      Un département est retenu dès qu'au moins une de ses communes appartient
      au périmètre du massif, sans seuil de surface. Pour les Ardennes et le
      Massif armoricain, hors zonage légal, l'emprise géologique fait foi.

  facades_maritimes:
    name: Façades maritimes
    publisher: Choix éditorial
    license: —
    note: >
      Fondé sur le découpage officiel des documents stratégiques de façade,
      redécoupé par mer et par océan : la Manche, l'Atlantique et la
      Méditerranée sont distinguées pour leur valeur pédagogique, là où le
      découpage officiel regroupe Manche Est et mer du Nord, puis Manche
      Ouest et Atlantique Nord, selon les écosystèmes marins.
    convention: >
      Un département est retenu s'il borde la mer, estuaires inclus. Un
      département bordant deux façades figure dans les deux listes.

  parcs_nationaux:
    name: Les parcs nationaux de France
    publisher: Office français de la biodiversité
    url: https://www.parcsnationaux.fr
    license: —
    convention: >
      Départements du cœur et de l'aire optimale d'adhésion, telle que fixée
      par le décret de création du parc. L'aire d'adhésion effective, qui
      dépend de l'adhésion volontaire des communes à la charte, n'est pas
      retenue car elle évolue dans le temps.

  pays:
    name: Les frontières de la France
    publisher: Ministère de l'Intérieur
    url: https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/
    license: —
    note: >
      8 pays frontaliers en métropole, 2 en Guyane. Les Pays-Bas sont ajoutés
      au titre de la frontière de 13 km sur l'île de Saint-Martin, absente de
      cette page.
    convention: >
      Frontières terrestres uniquement. Un département est retenu si sa limite
      administrative coïncide avec la frontière internationale.

  langues:
    name: Les langues de la France
    publisher: DGLFLF / Bernard Cerquiglini
    url: https://www.ladocumentationfrancaise.fr/var/storage/rapports-publics/994000719.pdf
    vintage: "1999"
    license: —
    note: >
      Sélection de 31 langues territorialisées sur les 82 recensées par la
      DGLFLF. Les langues sans territoire (yiddish, romani, arménien
      occidental, berbère, arabe dialectal) sont exclues : elles ne peuvent
      pas être placées sur une carte. Les langues kanak et polynésiennes
      sont regroupées par famille.
    convention: >
      Aires linguistiques historiques maximales, et non l'usage contemporain.
      Ni le rapport Cerquiglini ni la DGLFLF ne cartographient ces aires : le
      rattachement aux départements est un choix éditorial. Un département est
      retenu dès qu'une partie de son territoire relève de l'aire. Les
      chevauchements sont assumés : les zones de transition, notamment le
      Croissant entre langues d'oïl et occitan, figurent dans les deux listes.

